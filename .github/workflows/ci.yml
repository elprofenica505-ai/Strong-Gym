name: CI

# Corre en cada push y en cada Pull Request:
# si algo no compila, GitHub te avisa antes de publicar en Vercel.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Tipos y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar tipos de TypeScript
        run: npm run typecheck

      - name: Revisar el código con ESLint
        run: npm run lint

      - name: Probar autenticación, CRM y QR
        run: npm run test:auth

      - name: Probar Cuentas y Reportes con Next/RSC
        run: npm run test:finance:rsc

      - name: Compilar
        run: npm run build
        env:
          # Sin Supabase, el build queda cerrado: no habilita demo ni operaciones.
          # Estas variables quedan vacías a propósito.
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          # Intento explícito: NODE_ENV=production debe ignorarlo igualmente.
          NEXT_PUBLIC_ENABLE_DEMO: "true"

      - name: Preparar Chromium para pruebas de diseño
        run: npx playwright-core install --with-deps chromium

      - name: Probar shell y pantallas financieras en celular y escritorio
        run: npm run test:layout

      - name: Verificar metadatos e imágenes para compartir
        run: npm run test:metadata

  sql:
    name: Base de datos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: El SQL tiene que estar sincronizado con la web
        run: node scripts/build-sql.mjs --check

      - name: Probar el SQL con PGlite (una conexión)
        run: npm run test:sql

      # Estas suites existían pero no corrían en CI y se fueron quedando
      # atrás (una fecha fija venció sin que nadie lo notara). Deben correr
      # siempre: si una prueba no se ejecuta, no protege nada.
      - name: Probar el historial paginado de Caja (PGlite)
        run: npm run test:finance:movements

      # Anular un cobro tiene que dar de baja la vigencia: si esto se rompe,
      # alguien entra gratis y nadie se entera.
      - name: Probar que anular da de baja la vigencia (PGlite)
        run: npm run test:planes:anulacion

      - name: Probar el uso de cada plan y su historial de precios (PGlite)
        run: npm run test:planes:uso

      # Abrir, contar y cerrar la caja: si el arqueo se rompe, el dinero deja
      # de cuadrar y nadie se entera hasta que falta en el bolsillo.
      - name: Probar apertura, arqueo y cierre de caja (PGlite)
        run: npm run test:caja:arqueo

      - name: Probar roles, entrenadores y cierre de caja (PGlite)
        run: npm run test:roles

      - name: Probar medidas, metas, rutinas y asistencia (PGlite)
        run: npm run test:medidas

      - name: Probar productos, nutrición y registro (PGlite)
        run: npm run test:productos

  finance-concurrency:
    name: Concurrencia PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: strong_gym_test_concurrency
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probar contención y recuperación formulario/API/SQL
        run: npm run test:finance:concurrency
        env:
          # Credenciales públicas del contenedor desechable; nunca Supabase.
          TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/strong_gym_test_concurrency
