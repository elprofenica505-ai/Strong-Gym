name: CI

# Corre en cada push y en cada Pull Request:
# si algo no compila, GitHub te avisa antes de publicar en Vercel.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Tipos y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar tipos de TypeScript
        run: npm run typecheck

      - name: Revisar el código con ESLint
        run: npm run lint

      - name: Probar autenticación, CRM y QR
        run: npm run test:auth

      - name: Compilar
        run: npm run build
        env:
          # El build funciona sin Supabase (modo demo).
          # Estas variables quedan vacías a propósito.
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""

  sql:
    name: Base de datos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: El SQL tiene que estar sincronizado con la web
        run: node scripts/build-sql.mjs --check

      - name: Probar el SQL contra un PostgreSQL real
        run: npm run test:sql
