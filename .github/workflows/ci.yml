name: CI

# Corre en cada push y en cada Pull Request:
# si algo no compila, GitHub te avisa antes de publicar en Vercel.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Tipos y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar tipos de TypeScript
        run: npm run typecheck

      - name: Revisar el código con ESLint
        run: npm run lint

      - name: Probar autenticación, CRM y QR
        run: npm run test:auth

      - name: Probar Cuentas y Reportes con Next/RSC
        run: npm run test:finance:rsc

      - name: Compilar
        run: npm run build
        env:
          # El build funciona sin Supabase (modo demo).
          # Estas variables quedan vacías a propósito.
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""

      - name: Preparar Chromium para pruebas de diseño
        run: npx playwright-core install --with-deps chromium

      - name: Probar shell y pantallas financieras en celular y escritorio
        run: npm run test:layout

      - name: Verificar metadatos e imágenes para compartir
        run: npm run test:metadata

  sql:
    name: Base de datos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: El SQL tiene que estar sincronizado con la web
        run: node scripts/build-sql.mjs --check

      - name: Probar el SQL con PGlite (una conexión)
        run: npm run test:sql

  finance-concurrency:
    name: Concurrencia PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: strong_gym_test_concurrency
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probar contención, idempotencia, rollback y cambio de rol
        run: npm run test:finance:concurrency
        env:
          # Credenciales públicas del contenedor desechable; nunca Supabase.
          TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/strong_gym_test_concurrency
